name: Bootstrap DKR.01 content

on:
  push:
    branches:
      - bootstrap/deep-study-foundation
    paths:
      - '.bootstrap/dkr01z.ready'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand exact payload
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/dkr01x.part.000 .bootstrap/dkr01x.part.001 .bootstrap/dkr01z.part.* > /tmp/dkr01_payload.b64
          echo 'e96c69cae0c536cdf843fa07c4f2aaaf7ce9dae0dc55fd730268623e8b479994  /tmp/dkr01_payload.b64' | sha256sum -c -
          base64 -d /tmp/dkr01_payload.b64 > /tmp/dkr01_payload.tar.gz
          echo '5881c30ac689a5c9488b49030a613a7c58211d420c4f1619c05546275402c504  /tmp/dkr01_payload.tar.gz' | sha256sum -c -
          tar -tzf /tmp/dkr01_payload.tar.gz
          tar -xzf /tmp/dkr01_payload.tar.gz -C .
      - name: Commit verified content and remove transport chunks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'deep-study-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            START_HERE.md CURRENT_STATE.md AGENTS.md CONTENT_STANDARD.md \
            meta/CONTINUATION_PROTOCOL.md \
            meta/standards/MODULE_GRANULARITY.md meta/standards/TERMINOLOGY.md \
            meta/prompts/CONTINUE_EXISTING_TRACK.md meta/prompts/NEW_TOPIC_SYLLABUS.md meta/prompts/PDF_GENERATION.md \
            meta/templates/study-document.yml meta/templates/STUDY_PDF_WORKFLOW.md \
            scripts/build_study_pdf.py assets/styles/deep-study-study-pdf.css \
            subjects/docker/DKR.01/README.md subjects/docker/DKR.01/DKR.01.md subjects/docker/DKR.01/document.yml subjects/docker/DKR.01/SOURCES.md \
            curriculum/devops/docker/PROGRESS.md
          git rm -- .bootstrap/dkr01x.part.000 .bootstrap/dkr01x.part.001 .bootstrap/dkr01x.part.002 .bootstrap/dkr01x.ready .bootstrap/dkr01z.part.* .bootstrap/dkr01z.ready
          if compgen -G '.bootstrap/dkr01.part.*' > /dev/null; then git rm -- .bootstrap/dkr01.part.*; fi
          git commit -m 'docs: add first Docker study module and continuation system'
          git push
