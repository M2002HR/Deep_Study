name: Promote approved DKR.01 study PDF

on:
  push:
    branches:
      - bootstrap/deep-study-foundation
    paths:
      - 'subjects/docker/DKR.01/APPROVED_CANDIDATE.yml'

permissions:
  contents: write
  actions: read

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Read approval contract
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          file='subjects/docker/DKR.01/APPROVED_CANDIDATE.yml'
          run_id=$(awk -F': *' '$1=="run_id" {print $2}' "$file")
          sha=$(awk -F': *' '$1=="sha256" {print $2}' "$file")
          artifact=$(awk -F': *' '$1=="artifact_name" {print $2}' "$file")
          test -n "$run_id"; test -n "$sha"; test -n "$artifact"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - name: Download exact approved Actions artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/approved
          gh run download '${{ steps.approval.outputs.run_id }}' -n '${{ steps.approval.outputs.artifact }}' -D /tmp/approved
          find /tmp/approved -maxdepth 2 -type f -print
      - name: Verify exact PDF and promote
        shell: bash
        run: |
          set -euo pipefail
          src=$(find /tmp/approved -name 'DS-DKR-01_v1.0.0.pdf' -type f | head -1)
          test -n "$src"
          actual=$(sha256sum "$src" | awk '{print $1}')
          test "$actual" = '${{ steps.approval.outputs.sha }}'
          test "$(pdfinfo "$src" | awk '/^Pages:/ {print $2}')" = '37'
          ./scripts/check_pdf_fonts.sh "$src"
          python scripts/check_pdf_clearance.py "$src" --min-mm 20 --frame-inset-mm 5 --min-frame-gap-mm 14
          pdftotext "$src" /tmp/dkr01.txt
          ! grep -q $'\uFFFD' /tmp/dkr01.txt
          mkdir -p subjects/docker/DKR.01/artifacts
          cp "$src" subjects/docker/DKR.01/artifacts/DS-DKR-01_v1.0.0.pdf
      - name: Commit only the approved artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'deep-study-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- subjects/docker/DKR.01/artifacts/DS-DKR-01_v1.0.0.pdf
          git diff --cached --quiet && exit 0
          git commit -m 'docs: promote approved DKR.01 study PDF'
          git push
