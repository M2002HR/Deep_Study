name: Sync DKR.02 coverage publication state

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-dkr02-coverage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact DKR.02 coverage row
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('curriculum/devops/docker/coverage-matrix.md')
          s = p.read_text(encoding='utf-8')
          old = '| DKR.02 | نصب، Editions، Platforms و Distribution | Core | planned | required | selected | as-applicable | as-applicable | required | required-if-relevant | required | pending | planned |'
          new = '| DKR.02 | نصب، Editions، Platforms و Distribution | Core | DS-DKR-02 v1.0.0 | required | selected | as-applicable | as-applicable | required | required-if-relevant | required | PASS 2026-08-12 | published-canonical |'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('Expected DKR.02 coverage row not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit coverage sync and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'deep-study-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- curriculum/devops/docker/coverage-matrix.md
          git rm -- .github/workflows/sync-dkr02-coverage.yml
          git commit -m 'docs: sync DKR.02 coverage publication state'
          git push origin HEAD:main
