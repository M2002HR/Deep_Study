name: Deep Study document contract

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repository contract
        run: ./scripts/check_repo_contract.sh
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
      - name: Canonical Docker syllabus PDF contract
        run: |
          PDF='curriculum/devops/docker/artifacts/docker_mastery_syllabus_v1.1.0.pdf'
          test -s "$PDF" || { echo "Missing canonical syllabus PDF: $PDF"; exit 1; }
          ./scripts/check_pdf_fonts.sh "$PDF"
          python scripts/check_pdf_clearance.py "$PDF" --min-mm 20 --frame-inset-mm 5 --min-frame-gap-mm 14
      - name: All published study PDF contracts
        run: bash scripts/check_published_study_docs.sh
