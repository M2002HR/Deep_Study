name: Build DKR.01 study PDF candidate

on:
  push:
    branches:
      - bootstrap/deep-study-foundation
    paths:
      - 'subjects/docker/DKR.01/DKR.01.md'
      - 'subjects/docker/DKR.01/document.yml'
      - 'scripts/build_study_pdf.py'
      - 'assets/styles/deep-study-study-pdf.css'
      - 'scripts/check_pdf_clearance.py'
      - 'scripts/check_pdf_fonts.sh'
      - '.github/workflows/build-dkr01.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc poppler-utils fontconfig libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0
      - name: Install pinned Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'weasyprint==68.0' 'beautifulsoup4==4.14.3' 'pypdf==5.9.0' 'PyYAML==6.0.2'
      - name: Fetch and register pinned Vazirmatn build fonts
        run: |
          set -euo pipefail
          mkdir -p .build/fonts "$HOME/.local/share/fonts/deep-study"
          base='https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/fonts/ttf'
          for f in Regular Medium Bold; do
            curl --fail --location --retry 3 "$base/Vazirmatn-$f.ttf" -o ".build/fonts/Vazirmatn-$f.ttf"
            cp ".build/fonts/Vazirmatn-$f.ttf" "$HOME/.local/share/fonts/deep-study/Vazirmatn-$f.ttf"
          done
          for f in .build/fonts/*.ttf; do fc-scan --format '%{family}\n' "$f" | grep -qi Vazirmatn; done
          fc-cache -f "$HOME/.local/share/fonts/deep-study"
          fc-match Vazirmatn | grep -qi Vazirmatn
      - name: Build candidate
        run: |
          python scripts/build_study_pdf.py \
            --source subjects/docker/DKR.01/DKR.01.md \
            --manifest subjects/docker/DKR.01/document.yml \
            --output .build/DS-DKR-01_v1.0.0.pdf \
            --font-dir .build/fonts \
            --style assets/styles/deep-study-study-pdf.css
      - name: Mechanical checks
        run: |
          test "$(pdfinfo .build/DS-DKR-01_v1.0.0.pdf | awk '/^Pages:/ {print $2}')" -gt 0
          ./scripts/check_pdf_fonts.sh .build/DS-DKR-01_v1.0.0.pdf
          python scripts/check_pdf_clearance.py .build/DS-DKR-01_v1.0.0.pdf --min-mm 20 --frame-inset-mm 5 --min-frame-gap-mm 14
          pdftotext .build/DS-DKR-01_v1.0.0.pdf .build/extracted.txt
          ! grep -q $'\uFFFD' .build/extracted.txt
          sha256sum .build/DS-DKR-01_v1.0.0.pdf | tee .build/SHA256SUMS
      - name: Upload candidate for mandatory visual QA
        uses: actions/upload-artifact@v4
        with:
          name: dkr01-study-pdf-candidate
          path: |
            .build/DS-DKR-01_v1.0.0.pdf
            .build/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
